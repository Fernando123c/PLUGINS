# ------------------------------------------------------------------ ITEMS DE PAGA
# Se detectan por TIPO DE ITEM (material). Se usan en el scanner y en "Entregar SIN items de paga".
# Nombres de materiales: https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Material.html
items-de-paga:
  materiales:
    - BLAZE_ROD          # jaulas
    - DIAMOND_SWORD      # espadas
    - NETHERITE_SWORD
    - DIAMOND_SHOVEL     # palas
    - NETHERITE_SHOVEL
    - DIAMOND_HOE        # azadas
    - NETHERITE_HOE
    - PLAYER_HEAD        # kits de paga (cabezas)
  # (opcional) tambien por nombre o lore. Dejalos vacios para detectar SOLO por item.
  nombre-contiene: []
  lore-contiene: []
  modelo-personalizado: false

# ------------------------------------------------------------------ SCANNER ANTI-HACKER
# Como funciona (liviano):
#  1) Cuando alguien MATA a otro jugador, durante "minutos-vigilancia" se anota (solo texto) que hace:
#     que recoge, que tira, quien recoge lo que tira, donde guarda cosas, quien las saca y que comandos usa.
#     A los jugadores que no matan a nadie NO se les vigila.
#  2) No se analiza nada hasta que lo BANEAN con uno de "comandos-de-ban". Ahi se revisa su inventario
#     y enderchest y se arma el reporte: si tiene los items de paga de sus victimas o a quien se los paso.
#  3) El reporte sale en el chat del staff, en /rbfernan scanner y en el webhook de Discord.
scanner:
  activado: true
  minutos-vigilancia: 120
  combate-segundos: 15           # si Minecraft no da el asesino (flecha, caida tras un golpe, fuego/lava/pocion de otro),
                                 # se usa el ultimo jugador que lo golpeo en estos segundos. Arregla "no mato a nadie".
  comandos-de-ban: [ipban, ban-ip, banip, ban, tempban, tempipban, tempbanip, ipbanall]
  avisar-si-no-hay-datos: false  # avisar aunque el baneado no haya matado a nadie
  max-lineas: 300                # movimientos guardados por jugador vigilado
  discord-webhook: ""            # vacio = usa el "discord-webhook" de arriba
  discord-titulo: "🔎 Scanner RbFernan | Hacker baneado"
  discord-adjuntar-reporte: true # manda tambien el reporte COMPLETO como archivo .txt

